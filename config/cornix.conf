# 右手側の送信出力も上げる（左は board の defconfig で +8dBm 済み）
# 右→左の通信が遅れる症状への対策。2026-10-01
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Windows の Intel／Realtek 製 Bluetooth で「見えるのに接続できない」対策（ZMK 公式の接続トラブル対処）
# 2M PHY を切って 1M PHY だけにする。1M は受信感度が良く、届く距離でも有利。2026-10-01
CONFIG_BT_CTLR_PHY_2M=n

# Windows（特に会社管理の PC）で「接続済みなのに入力が届かない」対策（ZMK 公式の接続トラブル対処）
# ペアリング時に PC に出る6桁の数字をキーボードで打って Enter。2026-10-01
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
