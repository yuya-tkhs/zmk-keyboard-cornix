name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "boards/*"
      - "config/*"
      # 自作 behavior（加速スクロール）だけ直したときもビルドする
      - "src/**"
      - "dts/**"
      - "CMakeLists.txt"
      - "Kconfig"
      - "zephyr/**"
    tags-ignore:
      - "*"

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main